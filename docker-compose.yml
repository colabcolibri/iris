# Iris + Mailpit. O container recebe .env.docker. O Compose não lê iris-app/.env.
# 1. cp .env.docker.example .env.docker
# 2. Troque os change-me e o IRIS_ADMIN_EMAIL nesse arquivo.
# 3. docker compose up -d --build
# Porta no host: exporte IRIS_HOST_PORT / MAILPIT_UI_PORT, ou grave num arquivo
# chamado .env na raiz. O env_file não altera a porta publicada.

services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${IRIS_HOST_PORT:-8792}:8792"
    env_file:
      - .env.docker
    volumes:
      - iris-data:/app/data
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || 8792) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  iris-data:
