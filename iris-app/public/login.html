<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Iris</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell login-shell">
      <main class="panel login-panel">
        <h1>Iris</h1>
        <p class="login-lead">Entre com o código enviado ao seu email.</p>

        <form id="login-form" class="login-form">
          <div class="form-field" id="email-step">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" required autocomplete="email" />
            <button type="button" class="btn-primary" id="send-code-btn">Enviar código</button>
          </div>

          <div class="form-field" id="code-step" hidden>
            <label for="login-code">Código de 6 dígitos</label>
            <input
              id="login-code"
              name="code"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              required
              autocomplete="one-time-code"
            />
            <button type="submit" class="btn-primary">Entrar</button>
          </div>

          <p class="error-banner" id="login-error" hidden></p>
        </form>
      </main>
    </div>

    <script type="module" src="/login.js"></script>
  </body>
</html>
