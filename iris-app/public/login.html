<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Iris</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell login-shell">
      <main class="panel login-panel">
        <header class="login-brand">
          <h1>Iris</h1>
        </header>

        <div class="login-progress" aria-hidden="true">
          <span class="login-progress-dot is-active" id="progress-email"></span>
          <span class="login-progress-dot" id="progress-code"></span>
        </div>

        <form id="login-form" class="login-form" novalidate>
          <section class="login-view" id="email-step">
            <h2 class="login-title">Entrar</h2>

            <div class="form-field">
              <label for="login-email">Email</label>
              <input
                id="login-email"
                name="email"
                type="email"
                required
                autocomplete="email"
                placeholder="seu@email.com"
              />
            </div>

            <button type="button" class="btn-primary btn-block" id="send-code-btn">
              Continuar
            </button>
          </section>

          <section class="login-view" id="code-step" hidden>
            <h2 class="login-title">Código de acesso</h2>
            <p class="login-sent-to">
              Enviado para <strong id="code-sent-email"></strong>
              <button type="button" class="btn-link btn-link-inline" id="change-email-btn">Alterar</button>
            </p>

            <div class="form-field">
              <label for="login-code" class="sr-only">Código de 6 dígitos</label>
              <input
                id="login-code"
                name="code"
                type="text"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                required
                autocomplete="one-time-code"
                placeholder="000000"
                class="login-code-input"
                aria-label="Código de 6 dígitos"
              />
            </div>

            <button type="submit" class="btn-primary btn-block" id="confirm-code-btn">
              Entrar
            </button>

            <p class="login-resend">
              <button type="button" class="btn-link" id="resend-code-btn">Reenviar código</button>
            </p>
          </section>

          <p class="login-feedback" id="login-feedback" hidden role="alert"></p>
        </form>
      </main>
    </div>

    <script type="module" src="/login.js"></script>
  </body>
</html>
