<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iris</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1.5rem;
      }

      main {
        max-width: 32rem;
        width: 100%;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
      }

      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Iris</h1>
      <p>Gestor de postagens para Instagram — fundação em construção.</p>
    </main>
  </body>
</html>
